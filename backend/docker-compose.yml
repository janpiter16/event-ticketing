version: '3.8'

services:
  app:
    image: laravelsail/php84-composer:latest
    container_name: eventflow-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ~/.composer:/root/.composer
    depends_on:
      - db
      - redis
    networks:
      - eventflow

  db:
    image: postgres:16-alpine
    container_name: eventflow-db
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventflow

  redis:
    image: redis:7-alpine
    container_name: eventflow-redis
    networks:
      - eventflow

  queue:
    image: laravelsail/php84-composer:latest
    container_name: eventflow-queue
    working_dir: /var/www/html
    command: php artisan queue:work redis
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
    networks:
      - eventflow

networks:
  eventflow:
    driver: bridge

volumes:
  postgres_data:
    driver: local
